

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Blog | Usanase</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="dashboard-container">

        <aside class="sidebar">

            <div class="logo-container">
                <div class="logo">
                    <span>U</span>
                </div>
                <p>Usanase</p>
            </div>

            <nav class="sidebar-navigation">
                <ul>

                    <li>
                        <a href="dashboard-home.html">
                            <span class="nav-icon">⌂</span>
                            <span>Overview</span>
                        </a>
                    </li>

                    <li>
                        <a href="dashboard-blogs.html">
                            <span class="nav-icon">▤</span>
                            <span>Blogs</span>
                        </a>
                    </li>

                    <li class="active">
                        <a href="dashboard-add-a-blog.html">
                            <span class="nav-icon">✎</span>
                            <span>Add a blog</span>
                        </a>
                    </li>

                </ul>
            </nav>

        </aside>

        <main class="dashboard-main">


            <header class="dashboard-header">

                <div class="dashboard-welcome">
                    <h1>Add a Blog</h1>
                    <p>Create and publish a new blog article</p>
                </div>

                <div class="header-actions">

                    <button class="messages-button" type="button"
                        aria-label="Messages">
                        <span class="header-icon">▰</span>
                        <span class="notification-count">3</span>
                    </button>

                    <button class="notifications-button" type="button"
                        aria-label="Notifications">
                        <span class="header-icon">♟</span>
                        <span class="notification-count">3</span>
                    </button>

                    <div class="profile-container">
                        <img src="../images/image.jpg"
                            alt="Usanase's profile picture"
                            class="profile-image">
                    </div>

                </div>

            </header>


            <section class="add-blog-section">

                <form class="add-blog-form">

                 <div class="form-group">
                        <label for="blog-title">Blog Title</label>

                        <input
                            type="text"
                            id="blog-title"
                            name="blog-title"
                            placeholder="Enter your blog title"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="blog-image">Upload Blog Image</label>

                        <input
                            type="file"
                            id="blog-image"
                            name="blog-image"
                            accept="image/*"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="blog-content">Blog Content</label>

                        <textarea
                            id="blog-content"
                            name="blog-content"
                            rows="10"
                            placeholder="Write your blog article here..."
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="publish-blog-button">
                        Publish Blog
                    </button>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
